name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Type-check with mypy (blocking)
        run: |
          python -m pip install --quiet mypy
          python -m mypy run_all.py adjudicate.py run_verify.py _audit_config.py _scanner_common.py _verdict_files.py report_formatter.py scan_regions.py scan_capabilities.py scan_contracts.py scan_deadcode.py scan_duplicates.py scan_forks.py scan_hardcoded.py scan_style.py scan_cli_smoke.py
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run test suite
        run: python -m pytest tests -q
      - name: Install and verify entrypoints
        run: |
          python -m pip install --quiet -e .
          auto-code-audit --version
          auto-code-adjudicate --version
          auto-code-verify --version
      - name: Build and verify wheel
        shell: bash
        run: |
          rm -rf dist wheel-smoke
          python -m pip install --quiet build
          python -m build --wheel --outdir dist
          python -m venv wheel-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            WHEEL_PY="$(pwd)/wheel-smoke/Scripts/python.exe"
          else
            WHEEL_PY="$(pwd)/wheel-smoke/bin/python"
          fi
          "$WHEEL_PY" -m pip install --quiet dist/*.whl
          mkdir -p wheel-smoke/outside
          cd wheel-smoke/outside
          "$WHEEL_PY" -c "import report_formatter, run_all; print(run_all.__version__)"
          "$WHEEL_PY" -m run_all --version
          "$WHEEL_PY" -m adjudicate --version
          "$WHEEL_PY" -m run_verify --version
      - name: Entrypoint --help smoke
        run: python scan_cli_smoke.py
      - name: End-to-end self-audit (dogfood)
        shell: bash
        run: |
          rm -rf dogfood
          mkdir -p dogfood/pkg/lib
          touch dogfood/pkg/lib/__init__.py
          printf 'def dead_a():\n    return 1\n' > dogfood/pkg/lib/unused.py
          python run_all.py --root dogfood --package pkg \
            --json dogfood/audit.json --markdown dogfood/audit.md --no-doc-channel
          cp dogfood/audit.json dogfood/pre.json
          printf 'def dead_b():\n    return 1\n' > dogfood/pkg/lib/unused2.py
          python run_all.py --root dogfood --package pkg \
            --json dogfood/audit.json --markdown dogfood/audit.md --no-doc-channel
          grep -q "## Changes since last run" dogfood/audit.md
          python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from run_all import _candidate_signatures, finding_evidence_hash
          report = json.load(open("dogfood/audit.json", encoding="utf-8"))
          dead = [
              (scanner, signature, detail)
              for scanner, triples in _candidate_signatures(report.get("scanners", {})).items()
              for signature, _, detail in triples
              if scanner == "deadcode" and signature.endswith("unused2.py")
          ]
          verdicts = {"verdicts": [
              {"scanner": s, "target_id": sig,
               "finding_evidence_hash": finding_evidence_hash(s, sig, det),
               "disposition": "true duplicate"}
              for s, sig, det in dead
          ]}
          json.dump(verdicts, open("dogfood/verdicts.json", "w"), indent=2)
          PY
          # 1) a still-present code-action verdict rejects the gate
          python run_verify.py --root dogfood --report dogfood/audit.json --verdicts dogfood/verdicts.json --no-tests \
            && { echo "verify should have rejected the still-present finding"; exit 1; } || true
          python - <<'PY'
          import json
          verdicts = json.load(open("dogfood/verdicts.json", encoding="utf-8"))
          for verdict in verdicts["verdicts"]:
              verdict["target_id"] = verdict["target_id"] + ".ghost"
              verdict["finding_evidence_hash"] = "0" * 64
          json.dump(verdicts, open("dogfood/verdicts.json", "w"), indent=2)
          PY
          # 2) the patch introduced a new DEAD module: the unified severity
          #    fallback (status=DEAD -> high) rejects it against --previous
          python run_verify.py --root dogfood --report dogfood/audit.json --verdicts dogfood/verdicts.json \
            --previous dogfood/pre.json --no-tests \
            && { echo "verify should have rejected the new DEAD module"; exit 1; } || true
          # 3) ghost verdicts + explicit test skip + no previous = acceptance
          python run_verify.py --root dogfood --report dogfood/audit.json --verdicts dogfood/verdicts.json --no-tests
      - name: Whitespace hygiene
        run: git diff --check
